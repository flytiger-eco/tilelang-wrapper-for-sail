[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tilelang-sail-cuda-wrapper"
version = "1.0.0"
description = "CUDA-style API wrapper forwarding tilelang.cuda usage to the PPU backend"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
# Intentionally no runtime dependency for now: the wrapper must be
# installable independently and must not pull in (or reinstall) tilelang
# itself.
#
# TODO: once `tilelang-sail` (tilelang for PPU) is published as an
# installable distribution, enable this dependency and pin its version.
# dependencies = [
#     "tilelang-sail",
# ]

[tool.setuptools]
packages = ["tilelang_sail_cuda_wrapper"]
